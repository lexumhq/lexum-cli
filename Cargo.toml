[package]
name = "Lexum-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
Lexum-compiler = { path = "../Lexum-compiler" }
Lexum-runtime = { path = "../Lexum-runtime/crates/Lexum-runtime" }
Lexum-tracer = { path = "../Lexum-runtime/crates/Lexum-tracer" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
colored = "2.0"
